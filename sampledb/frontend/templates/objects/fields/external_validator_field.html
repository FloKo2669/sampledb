<div data-external-validator-container>
  <div class="input-group">
    <input
      type="text"
      class="form-control"
      name="{{ id_prefix }}__text"
      placeholder="{{ (schema.placeholder or schema.title) | get_translated_text }}"
      data-external-validator-input
      {% if id_prefix + '__text' in form_data %}
        value="{{ form_data[id_prefix + '__text'] }}"
      {% elif data is not none and 'text' in data %}
        value="{{ data.text }}"
      {% endif %}
    />
    <span class="input-group-btn">
      <button
        type="button"
        class="btn btn-default"
        data-external-validator-trigger
        data-validator="{{ schema.validator }}"
      >
        {% if schema.button_label %}
          {{ schema.button_label | get_translated_text }}
        {% else %}
          {{ _('Validate') }}
        {% endif %}
      </button>
    </span>
  </div>
  {# Hidden inputs to carry validation state through the form POST #}
  <input
    type="hidden"
    name="{{ id_prefix }}__is_valid"
    data-external-validator-is-valid
    value="{% if id_prefix + '__is_valid' in form_data %}{{ form_data[id_prefix + '__is_valid'] }}{% elif data is not none and data.is_valid is defined %}{{ 'true' if data.is_valid else 'false' }}{% endif %}"
  />
  <input
    type="hidden"
    name="{{ id_prefix }}__validated_text"
    data-external-validator-validated-text
    value="{% if id_prefix + '__validated_text' in form_data %}{{ form_data[id_prefix + '__validated_text'] }}{% elif data is not none and data.validated_text is defined %}{{ data.validated_text }}{% endif %}"
  />
  {# Status display shown after a validation attempt #}
  <div data-external-validator-status style="margin-top: 4px; min-height: 1.2em;">
    {% if data is not none and data.is_valid is defined %}
      {% if data.is_valid %}
        <span class="text-success"><i class="fa fa-check"></i> {{ _('Valid') }}</span>
      {% else %}
        <span class="text-danger"><i class="fa fa-times"></i> {{ _('Invalid') }}</span>
      {% endif %}
    {% endif %}
  </div>
</div>
