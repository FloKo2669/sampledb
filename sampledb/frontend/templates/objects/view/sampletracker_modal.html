<!-- SampleTracker Export Modal -->
<div class="modal fade" id="sampletrackerExportModal" tabindex="-1" role="dialog" aria-labelledby="sampletrackerExportModalLabel">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <button type="button" class="close" data-dismiss="modal" aria-label="Close"><span aria-hidden="true">&times;</span></button>
        <h4 class="modal-title" id="sampletrackerExportModalLabel">{{ _('Export to Sample Tracker') }}</h4>
      </div>
      <form method="POST" action="{{ url_for('frontend.sampletracker', object_id=object_id, ) }}">
        {{ sampletracker_export_form.hidden_tag() }}
        <div class="modal-body">
          <div class="form-group">
            <label for="sampletracker-proposal" class="control-label">{{ _('Proposal') }}</label>
            <select id="sampletracker-proposal" name="proposal" class="selectpicker form-control" data-width="100%" data-live-search="true">
              {% if sampletracker_proposal_choices %}
                {% for choice in sampletracker_proposal_choices %}
                  <option value="{{ choice }}">{{ choice }}</option>
                {% endfor %}
              {% else %}
                <option value="" disabled="disabled" selected="selected">{{ _('No proposals available') }}</option>
              {% endif %}
            </select>
          </div>
          <div class="form-group">
            <label for="sampletracker-exp-session" class="control-label">{{ _('Experiment Session') }}</label>
            <select id="sampletracker-exp-session" name="experiment_session" class="selectpicker form-control" data-width="100%" data-live-search="true">
              {% if sampletracker_experiment_choices %}
                {% for choice in sampletracker_experiment_choices %}
                  <option value="{{ choice }}">{{ choice }}</option>
                {% endfor %}
              {% else %}
                <option value="" disabled="disabled" selected="selected">{{ _('No experiment sessions available') }}</option>
              {% endif %}
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-default" data-dismiss="modal">{{ _('Close') }}</button>
          <button type="submit" class="btn btn-primary">{{ _('Export') }}</button>
        </div>
      </form>
    </div>
  </div>
</div>
